services:

  # From https://github.com/bndw/wifi-card
  # Docker hub: https://hub.docker.com/r/bndw/wifi-card
  wifiqr:
    image: bndw/wifi-card:fbde2cd
    container_name: wifiqr
    #ports:
    #  - "3000:80"
    restart: unless-stopped

  # From https://github.com/jocxfin/pwgen
  # Docker hub: https://hub.docker.com/r/jocxfin/pwgen
  pwgen:
    image: jocxfin/pwgen:v1.92.5
    container_name: pwgen
    environment:
      - PW_LENGTH=12
    # ports:
    #   - "5069:5069"
    restart: unless-stopped

  # From: https://github.com/ckabalan/visualsubnetcalc
  # Docker hub: https://hub.docker.com/r/ckabalan/visualsubnetcalc
  visualsubnetcalc:
    image: ckabalan/visualsubnetcalc:1.3.6
    container_name: visualsubnetcalc
    # ports:
    #   - "8080:8080"
    restart: unless-stopped

  # Builds CA-only Starlink CIDR lists for the FortiGate external connector.
  # Writes to ./volumes/starlink-feed, which Caddy serves read-only at /feeds/.
  # No ports: it only makes outbound HTTPS to geoip.starlinkisp.net.
  starlink-feed:
    build: ./starlink-feed
    container_name: starlink-feed
    environment:
      - OUT=/data
      - ALLOW=*
      - MIN_V4=50
    volumes:
      - ${PWD}/volumes/starlink-feed:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    volumes:
      - ${PWD}/config/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${PWD}/volumes/caddy/data:/data
      - ${PWD}/volumes/caddy/config:/config
      - ${PWD}/volumes/starlink-feed:/srv/feeds:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
